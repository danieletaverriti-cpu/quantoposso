name: quantoposso
description: App semplice per controllo spese (giornaliere + fisse) con obiettivi e promemoria.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.1.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.0-pre.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
